# Include these locations inside the production site's existing server block.
# Set the server root to the deployed contents of the Next.js `out` directory.
# With trailingSlash enabled, each route exports as <route>/index.html.
index index.html;

location = / {
    try_files /index.html =404;
}

# Serve real files/assets, then route directories (for example /contact-us/)
# that contain their exported index.html. The standard Nginx directory
# redirect makes /contact-us resolve to /contact-us/.
location / {
    try_files $uri $uri/ =404;
}
